name: build
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: nttld/setup-ndk@v1
        with: { ndk-version: r25c }
      - name: Download ImGui
        run: |
          git clone --depth=1 --branch v1.90.1 https://github.com/ocornut/imgui.git imgui
      - name: NDK build
        run: |
          $ANDROID_NDK_HOME/ndk-build NDK_PROJECT_PATH=. APP_BUILD_SCRIPT=./Android.mk NDK_APPLICATION_MK=./Application.mk
      - uses: actions/upload-artifact@v4
        with:
          name: libx1dead
          path: libs/arm64-v8a/libx1dead.so
